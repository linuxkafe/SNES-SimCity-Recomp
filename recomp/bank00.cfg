# Bank 00 — System vectors, boot code, core routines
bank = 0
auto_vectors

# Includes for generated C
includes = "snes.h" "cpu_state.h" "ppu.h" "apu.h" "dma.h" "interp_bridge.h"

# Interrupt vectors (auto_vectors will populate from ROM)
# func I_RESET 0x8000
# func I_NMI 0x80B2
# func I_IRQ 0x8210

# Core system functions (from disassembly)
func Reset_Entry 0x8000
func NMI_Handler 0x80B2
func IRQ_Handler 0x8210
func COP_Handler 0x8211
func BRK_Handler 0x8239
func Abort_Handler 0x8000

# Force Abort_Handler to interpreter (M1X1 variant called but not emitted)
force_lle 0x008000

# Force NMI handler to interpreter (prevents re-entry issues during VBlank wait)
force_lle 0x0080B2

# Force VBlank wait loop to interpreter (prevents watchdog timeout at frame 2607)
force_lle 0x00927C
force_lle 0x009280
force_lle 0x009287
force_lle 0x00928F
# SMW's documented failure mode, verbatim from their cfg: "Without this
# directive, the JMP at the tail of I_RESET auto-promotes a bank_00_806B
# function whose recompiled body re-enters the spinlock from inside the C
# frame and hangs the watchdog at frame 0."
#
# force_lle at $9311 pins one PC INSIDE a function that begins at $930D, so
# the analyser still emitted the whole spinlock as native C
# (program_manifest.json: 00930D:M0X0 aot_eligible, reasons=[]). Measured
# consequence: bank_00_930D_M0X0 executed the STZ that cleared vblank token
# $00B9 and then spun to the master deadline every frame, 60 times a second,
# so the guest never yielded and the city never simulated. exclude_range is
# the declaration that covers the whole block.
exclude_range 0x930D 0x9318  # vblank wait spinlock: STZ $00B9 / INC $00C7 / LDA $00B9 / BEQ / RTS

# Force the VBlank_Wait entry to the interpreter. Declared as a func below, so
# under `--cfg-roots` it is an analysis root, and it reaches one function the
# AOT emitter must not compile: bank_00_8D65_M1 ($00:8D65-$00:8DA1, 29 instr).
# That single function renders the game black - the emulated field comes out
# 100% black and byte-identical every frame while the CPU keeps running.
# Measured, one declaration at a time: seeding VBlank_Wait alone produces
# exactly 1 AOT function and a black screen; the other nine declarations in
# this file seed 0 AOT and render, IRQ_Handler seeds 7 and renders. With
# --cfg-roots over the whole cfg set, this one line is the difference between
# 1 black frame-crc and 246. Same class as the entries above it: an entry the
# frame model needs interpreted, guarded by its address.
force_lle 0x00804D

# Main game loop entry
func MainLoop 0x805C

# Initialize hardware
func Init_Hardware 0x8061

# VBlank wait loop
func VBlank_Wait 0x804D

# The bit-packing routine at $8EA9, chosen by measurement rather than by
# scanning: with SNESRECOMP_PHASE_MS=1 the interpreter histogram put a tight
# cluster here ($8EC7-$8EEA, ~9% of ALL interpreted execution) - a run of LSR A
# / AND / STA $025x, which is ordinary game logic and not a spin-wait. No func
# was declared anywhere in 0x8E00-0x9400, so all of it ran interpreted.
#
# The boundary is a textbook one: RTS at $8EA8 ends the previous function and
# REP #$30 at $8EA9 is the classic 65816 prologue, followed immediately by the
# body that the profile says is hot.
func PPU_Bitpack_8EA9 0x8EA9

# Exclude data regions
exclude_range 0x0000 0x0100  # Zero page
exclude_range 0x0100 0x0200  # Stack page
