# Bank 05 — Sound, music, SPC700 communication
bank = 5

includes = "snes.h" "cpu_state.h" "ppu.h" "apu.h" "dma.h" "interp_bridge.h"

# SPC700 communication
func SPC_Upload 0x8000
func SPC_Command 0x8100
func SPC_Read 0x8200

# Music playback
func Music_Play 0x8300
func Music_Stop 0x8400
func Music_Fade 0x8500

# Sound effects
func SFX_Play 0x8600
func SFX_Update 0x8700

# Exclude SPC data
exclude_range 0x0000 0x8000