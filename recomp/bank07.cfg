# Bank 07 (LoROM mirror of bank 0F) — Title screen, logo, cutscenes
bank = 7

includes = "snes.h" "cpu_state.h" "ppu.h" "apu.h" "dma.h" "interp_bridge.h"

# Title screen
func Title_Init 0x8000
func Title_Draw 0x8200
func Title_Update 0x8400
func Title_Input 0x8600

# Logo rendering
func Logo_Draw 0x8800
func Stars_Draw 0x8A00
func Skyline_Draw 0x8C00

# Cutscenes
func Cutscene_Play 0x8E00

# Exclude title graphics
exclude_range 0x0000 0x8000