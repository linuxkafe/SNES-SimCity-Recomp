# Bank 02 — Graphics, tile rendering, map display
bank = 2

includes = "snes.h" "cpu_state.h" "ppu.h" "apu.h" "dma.h" "interp_bridge.h"

# Tile rendering
func Tile_Draw 0x8000
func Tilemap_Render 0x8200
func BG_Update 0x8400
func Palette_Update 0x8600

# Map rendering
func Map_Draw 0x8800
func Minimap_Draw 0x8A00

# Isometric projection
func Iso_Project 0x8C00
func Iso_Tile_Draw 0x8E00

# Building sprites
func Building_Draw 0x9000
func Sprite_Update 0x9200

# Exclude graphics data
exclude_range 0x0000 0x4000  # Tile data
exclude_range 0x4000 0x2000  # Palette data